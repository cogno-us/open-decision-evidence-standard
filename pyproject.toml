[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-decision-evidence-standard"
version = "0.2.0"
description = "Reference tooling for ODES portable decision evidence records."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
odes = "odes.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
