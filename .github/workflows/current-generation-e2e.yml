# Runs tests/test_current_generation.py end to end against the real Replay at exactly CUR_REPLAY_REVISION (src/odes/common.py).
# ODES_REQUIRE_CUR_E2E=1 makes the end-to-end tests FAIL instead of skip if the pinned Replay cannot be set up.
name: Current generation end-to-end
'on':
  pull_request: null
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  current-generation:
    name: Current generation tests against pinned Replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install -e '.[dev]' pydantic
    - name: Fetch Replay at the pinned revision
      run: |
        REV="$(python -c 'from odes.common import CUR_REPLAY_REVISION as r; print(r)')"
        echo "Pinned Replay revision: $REV"
        git init -q "$RUNNER_TEMP/replay"
        git -C "$RUNNER_TEMP/replay" fetch -q --depth 1 https://github.com/cogno-us/cognous-replay-bundle.git "$REV"
        git -C "$RUNNER_TEMP/replay" checkout -q --detach FETCH_HEAD
        test "$(git -C "$RUNNER_TEMP/replay" rev-parse HEAD)" = "$REV"
    - run: python -m pytest -q tests/test_current_generation.py
      env:
        ODES_TEST_REPLAY_REPO: ${{ runner.temp }}/replay
        ODES_REQUIRE_CUR_E2E: '1'
        PYTHONDONTWRITEBYTECODE: '1'
