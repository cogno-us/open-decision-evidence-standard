  push:
    branches:
    - consumer/merged-producer-compatibility
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/open-decision-evidence-standard--merged-producers.yml@b3942698d52da47ad947259c0310603f4c29113c
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: b3942698d52da47ad947259c0310603f4c29113c
    permissions:
      contents: read
