# Cross-component suite delegated to its canonical testing repository.
name: Merged producer compatibility
'on':
  push:
    branches:
    - consumer/merged-producer-compatibility
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/open-decision-evidence-standard--merged-producers.yml@43fb81dc3ec0da17402bef274dcec1831cc5e160
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 43fb81dc3ec0da17402bef274dcec1831cc5e160
    permissions:
      contents: read
