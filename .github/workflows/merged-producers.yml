    branches:
    - consumer/merged-producer-compatibility
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/open-decision-evidence-standard--merged-producers.yml@39f038435afdd71ba162860faa5718d90d7bde64
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 39f038435afdd71ba162860faa5718d90d7bde64
    permissions:
      contents: read
