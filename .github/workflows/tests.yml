# Cross-component suite delegated to its canonical testing repository.
name: Tests
'on':
  pull_request: null
  push:
    branches:
    - main
    - worker8-odes-cognous-export
    - worker14/executor-profile-v1
    - worker8/odes-control-plane-store-compatibility
permissions:
  contents: read
jobs:
  native:
    name: Component-local checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install -e '.[dev]'
    - run: python -c 'import odes; from odes.exporter import export_cognous_stack_package'
      env:
        PYTHONPATH: .:src
        PYTHONDONTWRITEBYTECODE: '1'
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/open-decision-evidence-standard--tests.yml@43fb81dc3ec0da17402bef274dcec1831cc5e160
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 43fb81dc3ec0da17402bef274dcec1831cc5e160
    permissions:
      contents: read
