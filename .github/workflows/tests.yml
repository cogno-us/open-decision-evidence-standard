name: Tests

on:
  pull_request:
  push:
    branches: [main, worker8-odes-cognous-export]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned Manifest
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-agent-action-manifest
          ref: 46c950bed37fe3812000895430bc0312d29e37ce
          path: external/manifest

      - name: Checkout pinned Authority Context
        uses: actions/checkout@v4
        with:
          repository: cogno-us/constitutional-governance-for-institutions
          ref: fb3d97938969a89e149e8ff8db2756091d1233fc
          path: external/alvorada

      - name: Checkout pinned Control Plane
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-agent-control-plane
          ref: 283500652d47a692fb0b99a1172a6d5faffbd9a7
          path: external/control-plane

      - name: Checkout pinned Moltbot Safe
        uses: actions/checkout@v4
        with:
          repository: cogno-us/moltbot-safe
          ref: a4df7a925ca1b820b9958c479ce28616547cc6d0
          path: external/moltbot-safe

      - name: Checkout pinned Replay
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-agent-replay-bundle
          ref: 1b4eb0e79f76abc28f9816756cb774a8fc4b115f
          path: external/replay

      - name: Checkout pinned Governance Evidence Pack
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-agent-governance-evidence-pack
          ref: 8b59d430a43d09932bca5ea6b0b8f1f05f8f6f4
          path: external/agep

      - name: Verify pinned revisions
        run: |
          test "$(git -C external/manifest rev-parse HEAD)" = "46c950bed37fe3812000895430bc0312d29e37ce"
          test "$(git -C external/alvorada rev-parse HEAD)" = "fb3d97938969a89e149e8ff8db2756091d1233fc"
          test "$(git -C external/control-plane rev-parse HEAD)" = "283500652d47a692fb0b99a1172a6d5faffbd9a7"
          test "$(git -C external/moltbot-safe rev-parse HEAD)" = "a4df7a925ca1b820b9958c479ce28616547cc6d0"
          test "$(git -C external/replay rev-parse HEAD)" = "1b4eb0e79f76abc28f9816756cb774a8fc4b115f"
          test "$(git -C external/agep rev-parse HEAD)" = "8b59d430a43d09932bca5ea6b0b8f1f05f8f6f4"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and pinned Replay validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e external/replay
          python -m pip install -e .[dev]

      - name: Import smoke checks
        run: |
          python -c "import odes"
          python -c "from odes.exporter import export_cognous_stack_package"
          python -c "from odes.recipient_validator import evaluate_recipient_package"

      - name: Run tests
        env:
          UPSTREAM_MANIFEST_EXAMPLE: external/manifest/examples/refund_integration_v1_1.manifest.json
          UPSTREAM_REPLAY_SUCCESS_EXAMPLE: external/replay/examples/bounded_success_reconstruction_v0_2.json
          UPSTREAM_REPLAY_LOST_ACK_EXAMPLE: external/replay/examples/bounded_lost_ack_reconstruction_v0_2.json
        run: pytest -q tests

      - name: Generate and validate ODES export package
        env:
          UPSTREAM_MANIFEST_EXAMPLE: external/manifest/examples/refund_integration_v1_1.manifest.json
          UPSTREAM_REPLAY_SUCCESS_EXAMPLE: external/replay/examples/bounded_success_reconstruction_v0_2.json
        run: |
          python - <<'PY'
          import json
          import os
          with open(os.environ['UPSTREAM_REPLAY_SUCCESS_EXAMPLE'], encoding='utf-8') as handle:
              source = json.load(handle)
          source.setdefault('metadata', {})['freshness'] = 'current'
          with open('/tmp/reconstruction-current.json', 'w', encoding='utf-8') as handle:
              json.dump(source, handle, sort_keys=True)
          PY
          odes export-cognous --manifest "$UPSTREAM_MANIFEST_EXAMPLE" --reconstruction /tmp/reconstruction-current.json --out /tmp/odes-package.json --relying-party recipient.example.org --purpose audit
          odes validate-record /tmp/odes-package.json
          python - <<'PY'
          import json
          package = json.load(open('/tmp/odes-package.json'))
          policy = {
              'supported_profiles': ['odes_cognous_stack_export_0_1'],
              'relying_party': 'recipient.example.org',
              'purpose': 'audit',
              'evaluation_scope': 'recipient_reliance',
              'status_max_age_seconds': 300,
              'now': '2026-10-06T00:00:00Z',
              'trusted_digests': [package['package_digest']],
              'trusted_key_refs': [],
              'allow_unauthenticated_informational_inspection': True,
              'status_inputs': {
                  'record_id': package['record']['decision_id'],
                  'authority_basis': package['record']['authority']['authority_basis'],
                  'evaluation_scope': 'recipient_reliance',
                  'evaluated_at': '2026-10-06T00:00:00Z',
                  'evidence_freshness': 'current',
                  'freshness': 'current',
                  'revoked': False,
                  'superseded': False,
                  'authority_valid_at_decision_verified': True,
              },
          }
          json.dump(policy, open('/tmp/recipient-policy.json', 'w'), sort_keys=True)
          PY
          odes recipient-validate /tmp/odes-package.json --policy /tmp/recipient-policy.json --out /tmp/odes-recipient-result.json
          python - <<'PY'
          import json
          result = json.load(open('/tmp/odes-recipient-result.json'))
          assert result['schema_validity']['status'] == 'pass'
          assert result['package_content_integrity']['status'] == 'pass'
          assert result['integrity_authentication_checks']['status'] == 'unavailable'
          assert result['authority_status_and_freshness']['status'] == 'pass'
          assert result['recipient_reliance_decision']['status'] == 'informational_only'
          PY
